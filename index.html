<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NELPULSE BOOKS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f8f8f8;
color:#222;
}

header{
background:white;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
text-align:center;
position:sticky;
top:0;
}

.logo{
font-size:34px;
font-weight:700;
letter-spacing:3px;
}

.hero{
padding:70px 20px;
text-align:center;
}

.hero h1{
font-size:48px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
color:#666;
max-width:700px;
margin:auto;
}

.button{
display:inline-block;
margin-top:35px;
padding:16px 36px;
background:black;
color:white;
text-decoration:none;
border-radius:50px;
font-size:18px;
}

.books{
padding:60px 20px;
display:flex;
justify-content:center;
}

.book{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
max-width:320px;
text-align:center;
}

.book img{
width:100%;
border-radius:12px;
}

.book h2{
margin:20px 0 10px;
}

footer{
padding:40px;
text-align:center;
color:#777;
}

@media(max-width:768px){

.hero h1{
font-size:34px;
}

.hero p{
font-size:17px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
NELPULSE BOOKS
</div>

</header>

<section class="hero">

<h1>Premium Books For Extraordinary Minds</h1>

<p>
Welcome to NELPULSE BOOKS — where premium knowledge, unforgettable stories, and beautiful books come together.
</p>

<a class="button" href="#">
Explore Books
</a>

</section>

<section class="books">

<div class="book">

<img src="https://placehold.co/500x750?text=Book+Cover">

<h2>The Billionaire Architect of My Cage</h2>

<p>
Luxury Billionaire Fiction
</p>

</div>

</section>

<footer>

© 2026 NELPULSE BOOKS

</footer>

</body>
</html>
